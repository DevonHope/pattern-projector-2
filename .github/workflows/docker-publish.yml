name: Publish Docker image

# Builds the self-hosted image and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/<repo>:latest            (served at /, upstream behaviour)
#   ghcr.io/<owner>/<repo>:pattern-projector (served at /pattern-projector, for running behind a portal)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - base_path: ""
            suffix: ""
          - base_path: "/pattern-projector"
            suffix: "pattern-projector"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ matrix.suffix == '' }}
            type=raw,value=${{ matrix.suffix }},enable=${{ matrix.suffix != '' }}
            type=sha,prefix=${{ matrix.suffix && format('{0}-', matrix.suffix) || '' }}
            type=semver,pattern={{version}},suffix=${{ matrix.suffix && format('-{0}', matrix.suffix) || '' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BASE_PATH=${{ matrix.base_path }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.suffix || 'root' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix || 'root' }}
